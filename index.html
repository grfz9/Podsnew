    <!-- Écran de démarrage : fond sombre et logo dès la première image (pas de flash blanc), remplacé par l'appli. -->
    <style>
      html, body { background: #0d1111; margin: 0; height: 100%; }
      .boot { position: fixed; inset: 0; display: grid; place-items: center; background: radial-gradient(60% 50% at 50% 40%, #173a35, #0d1111 70%); }
      .boot svg { width: 84px; height: 84px; border-radius: 22px; box-shadow: 0 20px 50px -18px rgba(0, 0, 0, 0.9); animation: boot-in 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) both, boot-pulse 1.8s ease-in-out 0.6s infinite; }
      @keyframes boot-in { from { opacity: 0; transform: scale(0.8); } }
      @keyframes boot-pulse { 50% { transform: scale(1.05); } }
      @media (prefers-reduced-motion: reduce) { .boot svg { animation: none; } }
    </style>
